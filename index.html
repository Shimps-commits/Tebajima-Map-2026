<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3d5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hazard Map">
<title>Hazard Map | 出羽島・牟岐大島</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/edit.css">
<link rel="stylesheet" href="css/list.css">
</head>
<body>
<header id="bar">
  <h1 data-i18n="title">危険個所マップ</h1>
  <div id="areas">
    <button data-area="deba" data-i18n="deba">出羽島</button>
    <button data-area="oshima" data-i18n="oshima">牟岐大島</button>
  </div>
  <button id="list-btn" data-i18n="list">一覧</button>
  <button id="offline-btn" data-i18n="offline">オフライン</button>
  <button id="filter-btn" data-i18n="filter">絞り込み</button>
  <button id="lang-btn" data-i18n="lang">English</button>
</header>
<p id="notice" data-i18n="notice"></p>
<div id="map"></div>
<div id="filter-panel" hidden></div>
<section id="list-panel" hidden></section>
<section id="offline-panel" hidden></section>
<p id="loc-msg" role="status" hidden></p>
<button id="locate-btn" data-i18n="locate">現在地</button>
<section id="detail" hidden></section>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/i18n.js"></script>
<script src="js/map.js"></script>
<script src="js/hazards.js"></script>
<script src="js/filters.js"></script>
<script src="js/edit.js"></script>
<script src="js/categories.js"></script>
<script src="js/geoio.js"></script>
<script src="js/list.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/locate.js"></script>
</body>
</html>
